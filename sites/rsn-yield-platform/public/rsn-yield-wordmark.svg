  <rect x="13" y="48" width="6" height="8"  fill="#FFFFFF" rx="1"/>
  <rect x="22" y="40" width="6" height="16" fill="#FFFFFF" rx="1"/>
  <rect x="31" y="32" width="6" height="24" fill="#FFFFFF" rx="1"/>
  <rect x="40" y="22" width="6" height="34" fill="#FFFFFF" rx="1"/>
